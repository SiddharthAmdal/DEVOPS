version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    networks:
      - my-bridge-net

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - my-bridge-net

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-api:latest
    container_name: flask
    ports:
      - "5001:5001"
    depends_on:
      - mysql
      - redis
    networks:
      - my-bridge-net

networks:
  my-bridge-net:
    name: my-bridge-net
    driver: bridge
